/**/controller_manager:
  ros__parameters:
    update_rate: 300

    # One PI position controller per joint (output: effort)
    joint_1_1_pospid: { type: pid_controller/PidController }
    joint_1_2_pospid: { type: pid_controller/PidController }
    joint_1_3_pospid: { type: pid_controller/PidController }
    joint_1_4_pospid: { type: pid_controller/PidController }
    joint_2_1_pospid: { type: pid_controller/PidController }
    joint_2_2_pospid: { type: pid_controller/PidController }
    joint_2_3_pospid: { type: pid_controller/PidController }
    joint_2_4_pospid: { type: pid_controller/PidController }
    joint_3_1_pospid: { type: pid_controller/PidController }
    joint_3_2_pospid: { type: pid_controller/PidController }
    joint_3_3_pospid: { type: pid_controller/PidController }
    joint_3_4_pospid: { type: pid_controller/PidController }
    joint_4_1_pospid: { type: pid_controller/PidController }
    joint_4_2_pospid: { type: pid_controller/PidController }
    joint_4_3_pospid: { type: pid_controller/PidController }
    joint_4_4_pospid: { type: pid_controller/PidController }
    joint_5_1_pospid: { type: pid_controller/PidController }
    joint_5_2_pospid: { type: pid_controller/PidController }
    joint_5_3_pospid: { type: pid_controller/PidController }
    joint_5_4_pospid: { type: pid_controller/PidController }

    # State broadcaster (optional, usually loaded together)
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

# ------------- per-joint PI gains -------------
/**/joint_1_1_pospid:
  ros__parameters:
    dof_names: ["joint_1_1"]
    command_interface: effort
    reference_and_state_interfaces: ["position"]
    gains:
      joint_1_1: { p: 1.5, i: 0.0, d: 0.0, i_clamp_max: 0.0, i_clamp_min: 0.0 }

