name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ros_distro: humble
            os: ubuntu-22.04
          - ros_distro: jazzy
            os: ubuntu-24.04
          # Experimental: allowed to fail, does not gate Humble/Jazzy.
          - ros_distro: lyrical
            os: ubuntu-24.04
            experimental: true
            # MoveIt is not released for Lyrical yet; skip those keys
            # and leave dg5f_s_moveit_config out of the build there.
            skip_keys: >-
              moveit_ros_planning_interface moveit_ros_move_group moveit_ros_visualization moveit_simple_controller_manager moveit_planners_ompl moveit_kinematics
            colcon_args: --packages-ignore dg5f_s_moveit_config
    container:
      image: ros:${{ matrix.ros_distro }}-ros-base

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y git

      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone required dependencies
        run: |
          mkdir -p /ros2_ws/src
          cp -r $GITHUB_WORKSPACE /ros2_ws/src/dg5f_s_ros2
          git clone https://github.com/tesollodelto/dg_hardware.git /ros2_ws/src/dg_hardware
          git clone https://github.com/tesollodelto/dg_tcp_comm.git /ros2_ws/src/dg_tcp_comm

      - name: Install rosdep dependencies
        run: |
          rosdep update
          rosdep install --from-paths /ros2_ws/src --ignore-src -r -y \
            ${{ matrix.skip_keys && format('--skip-keys "{0}"', matrix.skip_keys) || '' }}

      - name: Build
        run: |
          . /opt/ros/${{ matrix.ros_distro }}/setup.sh
          cd /ros2_ws
          colcon build --event-handlers console_cohesion+ ${{ matrix.colcon_args }}
